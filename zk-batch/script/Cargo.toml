[package]
version = "0.1.0"
name = "agent-batch-script"
edition = "2021"
default-run = "batch"

[[bin]]
name = "batch"
path = "src/bin/main.rs"

[[bin]]
name = "vkey"
path = "src/bin/vkey.rs"

[dependencies]
sha2 = "0.10"
sp1-sdk = { version = "6.0.1", features = ["blocking"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }
hex = "0.4.3"
alloy-sol-types = { workspace = true }
alloy-primitives = { workspace = true }
ml-dsa = "0.1.1"
agent-batch-lib = { path = "../lib" }

[build-dependencies]
sp1-build = { version = "6.0.1" }
