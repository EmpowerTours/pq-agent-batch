name: prove

# Generates a REAL SP1 Groth16 proof of the zk-batch v2 guest on a free GitHub-hosted
# runner (public repo: 4 vCPU / 16 GB), using a big swap file to cover peak memory.
# No prover network and no credentials are used: SP1_PROVER=cpu, and Groth16 wrapping
# runs locally (gnark, via docker, which hosted runners provide).
# The batch is signed with deterministic TEST ML-DSA-65 keys (see zk-batch/script).

on:
  workflow_dispatch:
    inputs:
      n:
        description: "Batch size N (orders)"
        required: true
        default: "10"
      settlement:
        description: "Settlement address bound into the digest (default = fixed test address used by forge tests)"
        required: true
        default: "5e77000000000000000000000000000000005E77"
      chain_id:
        description: "Chain id bound into the digest (20143 = Monad testnet / Solonet)"
        required: true
        default: "20143"
      batch_id:
        description: "Batch id bound into the digest"
        required: true
        default: "1"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # maximum for GitHub-hosted runners
    env:
      SP1_PROVER: cpu
      RUST_LOG: info
      # Best-effort memory limiting on a 16 GB box: one core / recursion prover worker.
      SP1_WORKER_NUM_CORE_WORKERS: "1"
      SP1_WORKER_NUM_RECURSION_PROVER_WORKERS: "1"
    steps:
      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/local/.ghcup /usr/share/swift || true
          sudo docker image prune --all --force || true
          df -h

      - name: Add 32 GB swap
        run: |
          sudo swapoff -a || true
          # prefer the larger of / and /mnt
          ROOT_FREE=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          MNT_FREE=$(df --output=avail -BG /mnt 2>/dev/null | tail -1 | tr -dc 0-9 || echo 0)
          if [ "${MNT_FREE:-0}" -gt "$ROOT_FREE" ]; then SWAP=/mnt/swapfile; else SWAP=/swapfile; fi
          sudo rm -f "$SWAP"
          sudo fallocate -l 32G "$SWAP"
          sudo chmod 600 "$SWAP"
          sudo mkswap "$SWAP"
          sudo swapon "$SWAP"
          free -h
          df -h

      - uses: actions/checkout@v4

      - name: Install protobuf + SP1 toolchain
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q protobuf-compiler
          curl -L https://sp1up.succinct.xyz | bash
          ~/.sp1/bin/sp1up --version v6.3.1
          echo "$HOME/.sp1/bin" >> "$GITHUB_PATH"

      - name: Build host + guest
        working-directory: zk-batch
        run: cargo build --release

      - name: Execute first (sanity + cycle count)
        working-directory: zk-batch
        run: |
          ./target/release/vkey | tee vkey.txt
          ./target/release/batch --execute -n "${{ inputs.n }}" --chain-id "${{ inputs.chain_id }}" \
            --settlement "${{ inputs.settlement }}" --batch-id "${{ inputs.batch_id }}" | grep -E "RESULT|exit_code|^N="

      - name: Prove (Groth16, local CPU prover)
        working-directory: zk-batch
        run: |
          mkdir -p proof-out
          cp vkey.txt proof-out/
          ( while true; do sleep 300; echo "[mem $(date -u +%H:%M)] $(free -m | awk '/Mem/{print "ram used "$3"M"} /Swap/{print "swap used "$3"M"}' | tr '\n' ' ')"; done ) &
          /usr/bin/time -v ./target/release/batch --prove -n "${{ inputs.n }}" --chain-id "${{ inputs.chain_id }}" \
            --settlement "${{ inputs.settlement }}" --batch-id "${{ inputs.batch_id }}" \
            --proof-dir proof-out --out proof-out/batch.json 2>&1 | tee proof-out/prove.log
          test "${PIPESTATUS[0]}" = "0"

      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: groth16-batch-n${{ inputs.n }}
          path: |
            zk-batch/proof-out/
          if-no-files-found: warn
          retention-days: 30
