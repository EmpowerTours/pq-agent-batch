name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forge:
    name: Foundry tests (settlement, fees, fuzz, real Groth16 proofs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5   # pinned: the version the suite was developed on
      - name: Install pinned contract dependencies
        working-directory: contracts
        run: |
          forge install foundry-rs/forge-std@v1.16.1 --shallow --no-git
          forge install OpenZeppelin/openzeppelin-contracts@v5.6.1 --shallow --no-git
      - name: forge test
        working-directory: contracts
        run: forge test -vv
      - name: Watcher constants match the compiled ABI
        run: python3 watcher/check_constants.py

  slither:
    name: Slither (fails on any untriaged medium/high finding)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - name: Install pinned contract dependencies
        working-directory: contracts
        run: |
          forge install foundry-rs/forge-std@v1.16.1 --shallow --no-git
          forge install OpenZeppelin/openzeppelin-contracts@v5.6.1 --shallow --no-git
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: slither (triage in audits/REPORT.md; suppressions are inline slither-disable comments)
        working-directory: contracts
        run: |
          pip install slither-analyzer==0.11.6
          slither . --filter-paths "lib/|test/|script/|src/dex/MockToken.sol" --exclude-dependencies --fail-medium

  halmos:
    name: Halmos symbolic checks (audit properties)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - name: Install pinned contract dependencies
        working-directory: contracts
        run: |
          forge install foundry-rs/forge-std@v1.16.1 --shallow --no-git
          forge install OpenZeppelin/openzeppelin-contracts@v5.6.1 --shallow --no-git
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: halmos
        working-directory: contracts
        run: |
          pip install halmos==0.3.3
          halmos --match-contract HalmosAudit --solver-timeout-assertion 60000 --loop 4

  cargo:
    name: Rust parser tests (agent-batch-lib)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo test (lib only, no SP1 toolchain needed)
        working-directory: zk-batch
        run: cargo test -p agent-batch-lib --release

  sdk:
    name: SDK/CLI (golden vectors + anvil end-to-end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - name: Install pinned contract dependencies
        working-directory: contracts
        run: |
          forge install foundry-rs/forge-std@v1.16.1 --shallow --no-git
          forge install OpenZeppelin/openzeppelin-contracts@v5.6.1 --shallow --no-git
      - name: cargo test (keys, pkHash, encoding, proved-batch golden vectors, batcher rules, keystore)
        working-directory: sdk
        run: cargo test --release --locked
      - name: pqagent CLI against a local anvil (init -> register -> fund -> sign -> status -> batch)
        run: bash sdk/tests/anvil_e2e.sh sdk/target/release/pqagent

  ts-sdk:
    name: TS SDK (golden parity + Rust cross-verification)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the Rust pqagent CLI (cross-check target)
        working-directory: sdk
        run: cargo build --release --locked --bin pqagent
      - name: npm ci + build
        run: npm ci && npm run build
      - name: vitest (keys, message, deterministic signatures, proved N=10/N=100 + agent-4 batches, batcher rules, keystore, Rust interop)
        env:
          PQAGENT_BIN: ${{ github.workspace }}/sdk/target/release/pqagent
        run: npm test -w sdk-ts

  mcp:
    name: MCP server (unit + stdio/HTTP smoke against anvil)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - name: Install pinned contract dependencies
        working-directory: contracts
        run: |
          forge install foundry-rs/forge-std@v1.16.1 --shallow --no-git
          forge install OpenZeppelin/openzeppelin-contracts@v5.6.1 --shallow --no-git
      - name: npm ci + build
        run: npm ci && npm run build
      - name: MCP unit tests (in-memory client)
        run: npm test -w mcp
      - name: anvil - TS SDK end-to-end + MCP smoke over stdio, streamable HTTP and local mode
        run: bash mcp/scripts/anvil-ci.sh

  guest-execute:
    name: SP1 guest execute (N=10) + tamper rejection
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install protobuf + SP1 toolchain
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q protobuf-compiler
          curl -L https://sp1up.succinct.xyz | bash
          ~/.sp1/bin/sp1up --version v6.3.1
          echo "$HOME/.sp1/bin" >> "$GITHUB_PATH"
      - name: Build host + guest
        working-directory: zk-batch
        run: cargo build --release
      - name: Execute N=10 (cycle count)
        working-directory: zk-batch
        run: ./target/release/batch --execute -n 10 | grep -E "RESULT|exit_code"
      - name: SDK-signed golden batch (pqagent batcher output) executes and commits the proved digest
        working-directory: zk-batch
        run: |
          ./target/release/batch --execute --input ../sdk/tests/fixtures/batch-input-b1-n10.json | tee sdk.log | grep -E "RESULT|exit_code"
          grep -q "committed=0xbfb669f4e723f4717d8c1041faec9860f40c08ff4465ccb2c200d8a96ddea12c" sdk.log
      - name: Tampered batch must be rejected
        working-directory: zk-batch
        run: |
          set +e
          ./target/release/batch --execute -n 4 --tamper; code=$?
          test "$code" = "2" && echo "rejected as expected"
