name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forge:
    name: Foundry tests (v1 + v2 settlement, fuzz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5   # pinned: the version the suite was developed on
      - name: Install pinned contract dependencies
        working-directory: contracts
        run: |
          forge install foundry-rs/forge-std@v1.16.1 --shallow --no-git
          forge install OpenZeppelin/openzeppelin-contracts@v5.6.1 --shallow --no-git
      - name: forge test
        working-directory: contracts
        run: forge test -vv

  cargo:
    name: Rust parser tests (agent-batch-lib)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo test (lib only, no SP1 toolchain needed)
        working-directory: zk-batch
        run: cargo test -p agent-batch-lib --release

  guest-execute:
    name: SP1 guest execute (N=10) + tamper rejection
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install protobuf + SP1 toolchain
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q protobuf-compiler
          curl -L https://sp1up.succinct.xyz | bash
          ~/.sp1/bin/sp1up --version v6.3.1
          echo "$HOME/.sp1/bin" >> "$GITHUB_PATH"
      - name: Build host + guest
        working-directory: zk-batch
        run: cargo build --release
      - name: Execute N=10 (cycle count)
        working-directory: zk-batch
        run: ./target/release/batch --execute -n 10 | grep -E "RESULT|exit_code"
      - name: Tampered batch must be rejected
        working-directory: zk-batch
        run: |
          set +e
          ./target/release/batch --execute -n 4 --tamper; code=$?
          test "$code" = "2" && echo "rejected as expected"
